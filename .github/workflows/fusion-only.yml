    steps:
      - name: 📥 1. Checkout Rama Fusion (Mesa 26.2)
        uses: actions/checkout@v4
        with:
          ref: fusion
          submodules: false
          fetch-depth: 0

      - name: 📥 2. Traer Dockerfile.build y Adrenotools desde el Wrapper
        uses: actions/checkout@v4
        with:
          repository: Over-cmd/gamenative-wrapper
          ref: wrapper-25
          submodules: 'recursive'
          path: temp-wrapper
          fetch-depth: 1

      - name: 🧩 2.1. Inyectar infraestructura faltante (Dockerfile y Subproyectos)
        run: |
          echo "Copiando Dockerfile.build y subproyectos necesarios..."
          cp temp-wrapper/Dockerfile.build .
          
          if [ -d "temp-wrapper/subprojects" ]; then
              mkdir -p subprojects
              cp -r temp-wrapper/subprojects/* subprojects/
          fi
          
          rm -rf temp-wrapper
          echo "Infraestructura lista."
