name: Bannerlator Mesa 26 Mali Wrapper CI (Rama Fusion)

on:
  push:
    branches:
      - fusion
  workflow_dispatch:

jobs:
  build-mesa26-fusion:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: 📥 1. Checkout Rama Fusion (Mesa 26.2 + Wrapper Limpio)
        uses: actions/checkout@v4
        with:
          ref: fusion
          submodules: false
          fetch-depth: 0

      - name: 📥 2. Recuperar scripts de compilación faltantes del Wrapper
        uses: actions/checkout@v4
        with:
          repository: Over-cmd/gamenative-wrapper
          ref: wrapper-25
          path: temp-wrapper
          fetch-depth: 1

      - name: 🧩 2.1. Inyectar build_inside.sh si no existe
        run: |
          if [ -f "temp-wrapper/build_inside.sh" ]; then
              cp temp-wrapper/build_inside.sh .
              chmod +x build_inside.sh
              echo "-> build_inside.sh restaurado y con permisos de ejecución."
          fi
          rm -rf temp-wrapper

      - name: ⚙️ 3. Instalar Herramientas de Compresión y patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd patchelf python3 bc

      - name: 🛠️ 3.5. Parche quirúrgico definitivo para índices de versión LLVM en meson.build
        run: |
          echo "Ejecutando script Python para proteger los índices del array de versión de LLVM..."
          cat << 'EOF' > patch_meson.py
          with open('meson.build', 'r') as f:
              content = f.read()

          # 1. Inyectar los stubs de CLC justo después de project_version
          clc_stub = """
          prog_mesa_clc = disabler()
          prog_vtn_bindgen2 = disabler()
          """
          content = content.replace("project_version = meson.project_version()", f"{clc_stub}\nproject_version = meson.project_version()")

          # 2. Neutralizar la línea exacta que bloquea la compilación si CLC requiere LLVM
          content = content.replace(".enable_if(with_clc, error_message : 'CLC requires LLVM')", ".enable_if(false, error_message : 'Bypassed')")

          # 3. Proteger la extracción de versión mayor y menor para evitar errores de índice fuera de límites con 'unknown'
          old_version_logic = """chosen_llvm_version_major = chosen_llvm_version_array[0].to_int()
          chosen_llvm_version_minor = chosen_llvm_version_array[1].to_int()"""

          safe_version_logic = """chosen_llvm_version_major = chosen_llvm_version_array.length() > 0 and chosen_llvm_version_array[0] != 'unknown' ? chosen_llvm_version_array[0].to_int() : 0
          chosen_llvm_version_minor = chosen_llvm_version_array.length() > 1 and chosen_llvm_version_array[1] != 'unknown' ? chosen_llvm_version_array[1].to_int() : 0"""

          content = content.replace(old_version_logic, safe_version_logic)

          # 4. Hacer que libclc y libudev sean opcionales
          content = content.replace("dependency('libclc')", "dependency('libclc', required : false)")
          content = content.replace('dependency("libclc")', 'dependency("libclc", required : false)')
          content = content.replace("dependency('libudev')", "dependency('libudev', required : false)")
          content = content.replace('dependency("libudev")', 'dependency("libudev", required : false)')

          # 5. Hacer que wayland-egl-backend sea opcional
          content = content.replace("dependency('wayland-egl-backend'", "dependency('wayland-egl-backend', required : false")
          content = content.replace('dependency("wayland-egl-backend"', 'dependency("wayland-egl-backend", required : false')

          # 6. Hacer opcionales todas las variantes de XCB e infraestructura gráfica faltantes
          for dep in ['xcb-glx', 'x11-xcb', 'xcb-randr', 'xcb-xfixes', 'xcb-shm', 'xcb-sync', 'xcb-dri3', 'xcb-present', 'xshmfence']:
              content = content.replace(f"dependency('{dep}'", f"dependency('{dep}', required : false")
              content = content.replace(f'dependency("{dep}"', f'dependency("{dep}", required : false')

          # 7. Desactivar el bloque KMS/DRM que exige libdrm
          content = content.replace('if system_has_kms_drm', 'if false # system_has_kms_drm bypassed')

          with open('meson.build', 'w') as f:
              f.write(content)
          print('-> meson.build adaptado: protección de índices de LLVM aplicada con éxito.')
          EOF

          python3 patch_meson.py
          rm patch_meson.py

      - name: 🛠️ 3.6. build_inside.sh con plataformas x11 y wayland para Termux-X11
        run: |
          echo "Generando build_inside.sh optimizado para Termux-X11..."
          
          cat << 'EOF' > build_inside.sh
          #!/bin/bash
          set -e
          
          BUILD_DIR="${1:-build}"
          
          echo "Limpiando directorios de compilación previos..."
          rm -rf "$BUILD_DIR"
          
          echo "Configurando Meson para Mesa 26.2 (Android Cross-Compile + Termux-X11)..."
          
          CROSS_FILE=""
          if [ -f "android-aarch64.txt" ]; then
              CROSS_FILE="--cross-file android-aarch64.txt"
          fi
          
          meson setup "$BUILD_DIR" \
              --prefix=/usr \
              --libdir=lib \
              --buildtype=release \
              -Dplatforms=x11,wayland \
              -Dllvm=disabled \
              -Dshared-llvm=disabled \
              -Dmesa-clc=auto \
              -Dgallium-opencl=disabled \
              -Dvideo-codecs="" \
              -Dgallium-drivers=panfrost \
              -Dvulkan-drivers=panfrost,wrapper \
              $CROSS_FILE
              
          echo "Compilando con Meson..."
          meson compile -C "$BUILD_DIR"
          EOF
          
          chmod +x build_inside.sh
          echo "-> build_inside.sh generado correctamente."

      - name: 🐳 4. Construir Contenedor Gráfico Local con Panfrost
        run: |
          docker build -f Dockerfile.build -t local-wrapper-compiler:latest .

      - name: 🛠️ 5. Ejecutar Compilador Local Unificado
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" local-wrapper-compiler:latest ${{ env.BUILD_DIR }}

      - name: 📦 6. Forjar Paquete Esencial Original de Rendimiento Máximo (Mesa 26.2)
        run: |
          WRAPPER_SO="build/src/vulkan/wrapper/libvulkan_wrapper.so"
          
          if [ -f "$WRAPPER_SO" ]; then
            echo "-> [Host] ¡Éxito! Estructurando tu paquete original compatible de producción..."
            rm -rf final_pkg
            mkdir -p final_pkg/usr/lib final_pkg/usr/share/vulkan/icd.d
            
            cp -fv "$WRAPPER_SO" final_pkg/usr/lib/libvulkan_wrapper.so
            
            # REGLA DE COMODINES DE ADRENOTOOLS
            cp -fv ./build/subprojects/libadrenotools/*.so ./build/subprojects/libadrenotools/src/hook/*.so final_pkg/usr/lib/ 2>/dev/null || true
            chmod -R 755 final_pkg/usr/lib/
            
            patchelf --set-soname libvulkan_wrapper.so final_pkg/usr/lib/libvulkan_wrapper.so || true
            find final_pkg/usr/lib/ -name "*.so" -exec patchelf --set-rpath '$ORIGIN' {} \; 2>/dev/null || true
            
            # MANIFIESTO ICD
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
            
            sync && sleep 3
            
            cd final_pkg && tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/ && cd ..
            echo "-> ¡Paquete Mesa 26.2 + Wrapper forjado con éxito!"
          else
            echo "-> [❌ ERROR GRAVE] El binario libvulkan_wrapper.so no se encuentra en build/."
            exit 1
          fi

      - name: 🚀 7. Subir Artefacto Completo a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mesa26-Mali-Wrapper
          path: wrapper.tzst
          retention-days: 7
