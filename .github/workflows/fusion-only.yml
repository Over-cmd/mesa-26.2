name: Bannerlator Mesa 26 Mali Wrapper CI (Rama Fusion)

on:
  push:
    branches:
      - fusion
  workflow_dispatch:

jobs:
  build-mesa26-fusion:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build

    steps:
      - name: 📥 1. Checkout Rama Fusion (Mesa 26.2 + Wrapper Limpio)
        uses: actions/checkout@v4
        with:
          ref: fusion
          submodules: false
          fetch-depth: 0

      - name: 📥 2. Recuperar el Wrapper 25 completo (Restaurando Android y Wrapper nativos)
        uses: actions/checkout@v4
        with:
          repository: Over-cmd/gamenative-wrapper
          ref: wrapper-25
          path: temp-wrapper
          fetch-depth: 1

      - name: 🧩 2.1. Integrar el Wrapper 25 de forma segura (Protegiendo el WSI y Runtime de Mesa 26.2)
        run: |
          if [ -d "temp-wrapper" ]; then
              echo "Copiando recursos del Wrapper 25 y excluyendo WSI y Runtime antiguos..."
              rsync -av \
                --exclude='src/vulkan/wsi' \
                --exclude='src/vulkan/runtime' \
                temp-wrapper/ . || true
          fi
          rm -rf temp-wrapper
          echo "-> Estructura del Wrapper 25 integrada manteniendo los módulos limpios de Mesa 26.2."

      - name: ⚙️ 3. Instalar absolutamente todas las herramientas, bibliotecas y dependencias exigidas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zstd \
            patchelf \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            ninja-build \
            meson \
            cmake \
            libwayland-bin \
            libwayland-dev \
            wayland-protocols \
            libxcb1-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-xfixes0-dev \
            libxcb-sync-dev \
            libxcb-shm0-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxrandr-dev \
            libxext-dev \
            libxshmfence-dev \
            bc \
            flex \
            bison \
            git \
            build-essential \
            pkg-config \
            libdrm-dev \
            libglvnd-dev \
            libatomic1 \
            libc6-dev-arm64-cross \
            libatomic1-arm64-cross

      - name: 🛠️ 3.5. Adaptar componentes y definir variables globales faltantes como soong_compat_c_args
        run: |
          echo "Neutralizando src/compiler/clc/meson.build..."
          echo "idep_mesaclc = disabler()" > src/compiler/clc/meson.build

          echo "Ejecutando script Python para adaptar meson.build..."
          cat << 'EOF' > patch_meson.py
          import re
          import os

          with open('meson.build', 'r') as f:
              content = f.read()

          clc_stub = """
          prog_mesa_clc = disabler()
          prog_vtn_bindgen2 = disabler()
          dep_llvm = disabler()
          clang_version_dir = '0'
          soong_compat_c_args = []
          """
          content = content.replace("project_version = meson.project_version()", f"{clc_stub}\nproject_version = meson.project_version()")

          content = content.replace(".enable_if(with_clc, error_message : 'CLC requires LLVM')", ".enable_if(false, error_message : 'Bypassed')")

          content = content.replace("chosen_llvm_version_array[0].to_int()", "(chosen_llvm_version_array[0] == 'unknown' ? '0' : chosen_llvm_version_array[0]).to_int()")
          content = content.replace("chosen_llvm_version_minor = chosen_llvm_version_array[1].to_int()", "chosen_llvm_version_minor = chosen_llvm_version_array.length() > 1 and chosen_llvm_version_array[1] != 'unknown' ? chosen_llvm_version_array[1].to_int() : 0")

          content = re.sub(r"libclc\s*=\s*dependency\(\s*['\"]libclc['\"].*?\)", "libclc = disabler()", content, flags=re.DOTALL)

          def make_dep_optional_safely(text, lib_name):
              pattern = r"dependency\(\s*['\"]" + lib_name + r"['\"][^)]*\)"
              return re.sub(pattern, f"dependency('{lib_name}', required : false)", text, flags=re.DOTALL)

          for dep in ['LLVMSPIRVLib', 'SPIRV-Tools', 'libclc', 'expat']:
              content = make_dep_optional_safely(content, dep)

          content = content.replace("dependency('libudev')", "dependency('libudev', required : false)")
          content = content.replace('dependency("libudev")', 'dependency("libudev", required : false)')

          content = re.sub(r"dependency\(\s*['\"]wayland-egl-backend['\"].*?\)", "dependency('wayland-egl-backend', required : false)", content, flags=re.DOTALL)

          for dep in ['xcb-glx', 'x11-xcb', 'xcb-randr', 'xcb-xfixes', 'xcb-shm', 'xcb-sync', 'xcb-dri3', 'xcb-present', 'xshmfence', 'wayland-client', 'xcb', 'xrandr', 'expat']:
              content = content.replace(f"dependency('{dep}'", f"dependency('{dep}', required : false")
              content = content.replace(f'dependency("{dep}"', f'dependency("{dep}", required : false')

          content = content.replace('if system_has_kms_drm', 'if false # system_has_kms_drm bypassed')

          content = content.replace("dep_atomic = cc.find_library('atomic', required : true)", "dep_atomic = []")
          content = content.replace("dep_atomic = cc.find_library('atomic', required : false)", "dep_atomic = []")
          content = content.replace("dep_atomic = cpp.find_library('atomic', required : true)", "dep_atomic = []")
          content = content.replace("dep_atomic = cpp.find_library('atomic', required : false)", "dep_atomic = []")
          content = content.replace("dep_atomic = cc.find_library('atomic')", "dep_atomic = []")

          content = content.replace("cc.find_library('dl', required : true)", "cc.find_library('dl', required : false)")

          content = content.replace("dep_clock = cc.find_library('rt')", "dep_clock = []")
          content = content.replace("dep_clock = cc.find_library('rt', required : true)", "dep_clock = []")
          content = content.replace("dep_clock = cc.find_library('rt', required : false)", "dep_clock = []")

          with open('meson.build', 'w') as f:
              f.write(content)
          print('-> meson.build principal adaptado con soong_compat_c_args.')

          # Limpiar VkRenderingAttachmentInitialLayoutInfoMESA duplicado en vk_render_pass.h si existe
          render_pass_h = 'src/vulkan/runtime/vk_render_pass.h'
          if os.path.exists(render_pass_h):
              with open(render_pass_h, 'r') as f:
                  rp_code = f.read()
              rp_code = re.sub(r'typedef struct VkRenderingAttachmentInitialLayoutInfoMESA\s*\{[^}]*\}\s*VkRenderingAttachmentInitialLayoutInfoMESA\s*;', '', rp_code, flags=re.DOTALL)
              with open(render_pass_h, 'w') as f:
                  f.write(rp_code)
              print('-> vk_render_pass.h limpiado.')

          # Inyectar compatibilidad de VkImageUsageFlags2KHR en wsi_common.h
          wsi_common_h = 'src/vulkan/wsi/wsi_common.h'
          if os.path.exists(wsi_common_h):
              with open(wsi_common_h, 'r') as f:
                  wc_code = f.read()
              
              compat_types = """
              #ifndef VK_VERSION_1_3
              #ifndef VK_IMAGE_USAGE_FLAGS_2_KHR_DEFINED
              #define VK_IMAGE_USAGE_FLAGS_2_KHR_DEFINED
              typedef VkFlags VkImageUsageFlags2KHR;
              typedef struct VkImageUsageFlags2CreateInfoKHR {
                  VkStructureType sType;
                  const void *pNext;
                  VkImageUsageFlags2KHR usage;
              } VkImageUsageFlags2CreateInfoKHR;
              #ifndef VK_STRUCTURE_TYPE_IMAGE_USAGE_FLAGS_2_CREATE_INFO_KHR
              #define VK_STRUCTURE_TYPE_IMAGE_USAGE_FLAGS_2_CREATE_INFO_KHR ((VkStructureType) 1000499000)
              #endif
              #endif
              #endif
              """
              
              if 'VkImageUsageFlags2KHR' not in wc_code:
                  if '#include <vulkan/vulkan.h>' in wc_code:
                      wc_code = wc_code.replace('#include <vulkan/vulkan.h>', '#include <vulkan/vulkan.h>\n' + compat_types)
                  else:
                      wc_code = compat_types + wc_code
              
              with open(wsi_common_h, 'w') as f:
                  f.write(wc_code)
              print('-> wsi_common.h parcheado con tipos de compatibilidad Vulkan.')

          bitscan_path = 'src/util/bitscan.c'
          if os.path.exists(bitscan_path):
              with open(bitscan_path, 'r') as f:
                  b_code = f.read()
              
              def safe_wrap(code, func_name):
                  pattern = r'(\bint\s+' + func_name + r'\s*\([^)]*\)\s*\{)'
                  match = re.search(pattern, code)
                  if match:
                      start_brace = match.end() - 1
                      count = 1
                      curr = start_brace + 1
                      while curr < len(code) and count > 0:
                          if code[curr] == '{':
                              count += 1
                          elif code[curr] == '}':
                              count -= 1
                          curr += 1
                      if count == 0:
                          func_body = code[match.start():curr]
                          wrapped = f"#ifndef __BIONIC__\n{func_body}\n#endif"
                          code = code.replace(func_body, wrapped, 1)
                  return code

              b_code = safe_wrap(b_code, 'ffs')
              b_code = safe_wrap(b_code, 'ffsll')

              with open(bitscan_path, 'w') as f:
                  f.write(b_code)
          EOF

          python3 patch_meson.py
          rm patch_meson.py

          echo "Creando directorio local de pkg-config con stubs limpios..."
          mkdir -p local-pkgconfig
          for pc in android wayland-client xcb xcb-shm xrandr expat x11-xcb xcb-dri2 xcb-dri3 xcb-present xcb-randr xcb-sync xshmfence; do
              cat << EOF > local-pkgconfig/$pc.pc
          Name: $pc
          Description: Stub $pc for Android cross-compilation
          Version: 1.0
          Libs:
          Cflags: -I/workspace/include
          EOF
          done

          python3 -c "
          with open('src/egl/meson.build', 'r') as f:
              content = f.read()
          content = content.replace('configuration: {\'library_path\' : libegl.full_path()}', 'configuration: {\'library_path\' : \'libEGL.so\'}')
          with open('src/egl/meson.build', 'w') as f:
              f.write(content)
          "

          mkdir -p include/sync include/util include/expat include/xcb include/X11 include/libdrm lib_stubs
          
          for wh in /usr/include/wayland-*.h; do
              if [ -f "$wh" ]; then
                  cp "$wh" include/
              fi
          done

          if [ -d "/usr/include/xcb" ]; then
              cp -r /usr/include/xcb/* include/xcb/
          fi

          if [ -d "/usr/include/X11" ]; then
              cp -r /usr/include/X11/* include/X11/
          fi

          if [ -f "/usr/include/xshmfence.h" ]; then
              cp /usr/include/xshmfence.h include/
              cp /usr/include/xshmfence.h include/X11/
          fi

          if [ -d "/usr/include/libdrm" ]; then
              cp -r /usr/include/libdrm/* include/
              cp -r /usr/include/libdrm/* include/libdrm/
          fi

          for dh in /usr/include/drm*.h /usr/include/xf86drm*.h; do
              if [ -f "$dh" ]; then
                  cp "$dh" include/
                  cp "$dh" include/libdrm/
              fi
          done

          CLANG_PATH=$(find / -name "aarch64-linux-android*-clang" -type f 2>/dev/null | head -n 1)
          if [ -z "$CLANG_PATH" ]; then
              CLANG_PATH="/home/builder/lib/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
          fi
          NDK_TOOLCHAIN_BIN=$(dirname "$CLANG_PATH")
          NDK_SYSROOT="$(dirname "$NDK_TOOLCHAIN_BIN")/sysroot"

          cat << 'EOF' > stubs_impl.c
          #include <stddef.h>
          #include <stdint.h>
          #include <wayland-client.h>
          
          void* XML_ParserCreate(const char* encoding) { return NULL; }
          void XML_ParserFree(void* parser) {}
          void XML_SetUserData(void* parser, void* userData) {}
          void* XML_GetUserData(void* parser) { return NULL; }
          void XML_SetElementHandler(void* parser, void* start, void* end) {}
          void XML_SetCharacterDataHandler(void* parser, void* handler) {}
          int XML_Parse(void* parser, const char* s, int len, int isFinal) { return 1; }
          void* XML_GetBuffer(void* parser, int len) { return NULL; }
          int XML_ParseBuffer(void* parser, int len, int isFinal) { return 1; }
          const char* XML_ErrorString(int code) { return ""; }
          int XML_GetErrorCode(void* parser) { return 0; }
          int XML_GetCurrentLineNumber(void* parser) { return 0; }

          int wl_display_prepare_read_queue(struct wl_display *display, struct wl_event_queue *queue) { return 0; }
          int wl_display_flush(struct wl_display *display) { return 0; }
          int wl_display_read_events(struct wl_display *display) { return 0; }
          int wl_display_dispatch_queue_pending(struct wl_display *display, struct wl_event_queue *queue) { return 0; }
          void wl_display_cancel_read(struct wl_display *display) {}
          int wl_display_get_fd(struct wl_display *display) { return -1; }
          struct wl_event_queue* wl_display_create_queue(struct wl_display *display) { return NULL; }
          int wl_display_dispatch_queue(struct wl_display *display, struct wl_event_queue *queue) { return 0; }
          int wl_display_roundtrip_queue(struct wl_display *display, struct wl_event_queue *queue) { return 0; }
          
          const struct wl_interface wl_surface_interface = { "wl_surface", 1, 0, NULL };
          const struct wl_interface wl_registry_interface = { "wl_registry", 1, 0, NULL };
          const struct wl_interface wl_buffer_interface = { "wl_buffer", 1, 0, NULL };
          const struct wl_interface wl_shm_pool_interface = { "wl_shm_pool", 1, 0, NULL };
          const struct wl_interface wl_shm_interface = { "wl_shm", 1, 0, NULL };
          const struct wl_interface wl_callback_interface = { "wl_callback", 1, 0, NULL };
          const struct wl_interface wl_output_interface = { "wl_output", 1, 0, NULL };

          void* wl_proxy_create_wrapper(void *proxy) { return NULL; }
          void wl_proxy_set_queue(struct wl_proxy *proxy, struct wl_event_queue *queue) {}
          uint32_t wl_proxy_get_version(struct wl_proxy *proxy) { return 1; }
          struct wl_proxy* wl_proxy_marshal_flags(struct wl_proxy *proxy, uint32_t opcode, const struct wl_interface *interface, uint32_t version, uint32_t flags, ...) { return NULL; }
          int wl_proxy_add_listener(struct wl_proxy *proxy, void (**implementation)(void), void *data) { return 0; }
          void wl_proxy_destroy(struct wl_proxy *proxy) {}
          void wl_proxy_wrapper_destroy(void *proxy) {}
          void wl_event_queue_destroy(struct wl_event_queue *queue) {}
          uint32_t wl_proxy_get_id(struct wl_proxy *proxy) { return 1; }

          void wl_list_init(struct wl_list *list) {}
          void wl_list_insert(struct wl_list *list, struct wl_list *elm) {}
          int wl_list_length(const struct wl_list *list) { return 0; }
          void wl_list_remove(struct wl_list *elm) {}

          void* drmModeGetResources(int fd) { return NULL; }
          void drmModeFreeResources(void* ptr) {}
          int drmAuthMagic(int fd, uint32_t magic) { return 0; }
          int drmPrimeFDToHandle(int fd, int prime_fd, uint32_t *handle) { return -1; }
          int drmModeAddFB2(int fd, uint32_t width, uint32_t height, uint32_t pixel_format, const uint32_t bo_handles[4], const uint32_t pitches[4], const uint32_t offsets[4], uint32_t *buf_id, uint32_t flags) { return -1; }
          int drmIoctl(int fd, unsigned long request, void *arg) { return -1; }
          int drmModeRmFB(int fd, uint32_t buffer_id) { return -1; }
          int drmModeConnectorSetProperty(int fd, uint32_t connector_id, uint32_t property_id, uint64_t value) { return -1; }
          int drmSyncobjFDToHandle(int fd, int syncobj_fd, uint32_t *handle) { return -1; }
          int drmCrtcQueueSequence(int fd, uint32_t crtc_id, uint32_t flags, uint64_t sequence, uint64_t *target_sequence, uint64_t user_data) { return -1; }
          void drmSyncobjDestroy(int fd, uint32_t syncobj) {}
          int drmCrtcGetSequence(int fd, uint32_t crtc_id, uint64_t *sequence, uint64_t *ns) { return -1; }
          void* drmModeGetConnectorCurrent(int fd, uint32_t connector_id) { return NULL; }
          void drmModeFreeConnector(void* connector) {}
          void* drmModeGetConnector(int fd, uint32_t connector_id) { return NULL; }
          void drmModeFreeProperty(void* property) {}
          void* drmModeGetProperty(int fd, uint32_t property_id) { return NULL; }
          int drmHandleEvent(int fd, void* evctx) { return -1; }
          int drmSyncobjSignal(int fd, const uint32_t *syncobjs, uint32_t count_syncobjs) { return -1; }
          int drmModePageFlip(int fd, uint32_t crtc_id, uint32_t fb_id, uint32_t flags, void* user_data) { return -1; }
          int drmModeSetCrtc(int fd, uint32_t crtc_id, uint32_t buffer_id, uint32_t x, uint32_t y, uint32_t *connectors, int count, void* mode) { return -1; }
          int drmModeSetCursor(int fd, uint32_t crtc_id, uint32_t bo_handle, uint32_t width, uint32_t height) { return -1; }
          void* drmModeGetEncoder(int fd, uint32_t encoder_id) { return NULL; }
          void drmModeFreeEncoder(void* encoder) {}
          void drmModeFreeCrtc(void* crtc) {}
          void* drmModeGetCrtc(int fd, uint32_t crtc_id) { return NULL; }

          void* XGetXCBConnection(void* dpy) { return NULL; }
          void* xcb_randr_get_screen_resources(void* c, uint32_t window) { return NULL; }
          void* xcb_randr_get_screen_resources_reply(void* c, void* cookie, void* e) { return NULL; }
          void* xcb_randr_get_screen_resources_crtcs(void* reply) { return NULL; }
          void* xcb_randr_query_version(void* c, uint32_t major, uint32_t minor) { return NULL; }
          void* xcb_randr_query_version_reply(void* c, void* cookie, void* e) { return NULL; }
          const void* xcb_get_setup(void* c) { return NULL; }

          typedef struct { void *data; int rem; } xcb_generic_iterator_t;
          xcb_generic_iterator_t xcb_setup_roots_iterator(const void *R) { xcb_generic_iterator_t it = {NULL, 0}; return it; }
          xcb_generic_iterator_t xcb_screen_allowed_depths_iterator(const void *R) { xcb_generic_iterator_t it = {NULL, 0}; return it; }
          void xcb_screen_next(void *R) {}
          void xcb_depth_next(void *R) {}
          xcb_generic_iterator_t xcb_depth_visuals_iterator(const void *R) { xcb_generic_iterator_t it = {NULL, 0}; return it; }
          xcb_generic_iterator_t xcb_visualtype_next(const void *R) { xcb_generic_iterator_t it = {NULL, 0}; return it; }

          void* xcb_randr_get_screen_resources_outputs(void* reply) { return NULL; }
          void* xcb_randr_get_output_property(void* c, uint32_t output, uint32_t property, uint32_t type, uint32_t long_offset, uint32_t long_length, uint8_t delete, uint8_t pending) { return NULL; }
          void* xcb_randr_get_output_property_reply(void* c, void* cookie, void* e) { return NULL; }
          void* xcb_randr_get_output_property_data(void* reply) { return NULL; }
          void* xcb_intern_atom(void* c, uint8_t only_if_exists, uint16_t name_len, const char* name) { return NULL; }
          void* xcb_intern_atom_reply(void* c, void* cookie, void* e) { return NULL; }
          void* xcb_randr_get_crtc_info(void* c, uint32_t crtc, uint32_t config_timestamp) { return NULL; }
          void* xcb_randr_get_crtc_info_reply(void* c, void* cookie, void* e) { return NULL; }
          int xcb_randr_get_crtc_info_outputs_length(const void* reply) { return 0; }
          void* xcb_randr_get_crtc_info_outputs(const void* reply) { return NULL; }
          int xcb_randr_get_crtc_info_possible_length(const void* reply) { return 0; }
          void* xcb_randr_get_crtc_info_possible(const void* reply) { return NULL; }
          void* xcb_randr_get_output_info(void* c, uint32_t output, uint32_t config_timestamp) { return NULL; }
          void* xcb_randr_get_output_info_reply(void* c, void* cookie, void* e) { return NULL; }
          void* xcb_randr_get_output_info_modes(const void* reply) { return NULL; }
          xcb_generic_iterator_t xcb_randr_get_screen_resources_modes_iterator(const void* reply) { xcb_generic_iterator_t it = {NULL, 0}; return it; }
          void xcb_randr_mode_info_next(void* i) {}

          void* xcb_query_extension(void* c, uint16_t len, const char* name) { return NULL; }
          void xcb_discard_reply(void* c, unsigned int sequence) {}
          void* xcb_query_extension_reply(void* c, void* cookie, void* e) { return NULL; }
          void* xcb_randr_query_version_unchecked(void* c, uint32_t major, uint32_t minor) { return NULL; }
          void* xcb_randr_get_screen_resources_current_unchecked(void* c, uint32_t window) { return NULL; }
          void* xcb_randr_get_screen_resources_current_reply(void* c, void* cookie, void* e) { return NULL; }
          void* xcb_randr_get_screen_resources_current_outputs(void* reply) { return NULL; }
          const char* xcb_randr_get_output_info_name(const void* reply) { return ""; }
          void* xcb_query_tree(void* c, uint32_t window) { return NULL; }
          void* xcb_get_window_attributes(void* c, uint32_t window) { return NULL; }
          void* xcb_query_tree_reply(void* c, void* cookie, void* e) { return NULL; }
          void* xcb_get_window_attributes_reply(void* c, void* cookie, void* e) { return NULL; }
          void* xcb_get_geometry(void* c, uint32_t drawable) { return NULL; }
          void* xcb_get_geometry_reply(void* c, void* cookie, void* e) { return NULL; }
          uint32_t xcb_generate_id(void* c) { return 1; }
          void* xcb_create_gc(void* c, uint32_t cid, uint32_t drawable, uint32_t value_mask, const uint32_t *value_list) { return NULL; }
          void* xcb_free_pixmap(void* c, uint32_t pixmap) { return NULL; }
          void* xcb_sync_await_fence(void* c, uint32_t len, const void* fence_list) { return NULL; }
          uint32_t xcb_get_maximum_request_length(void* c) { return 65535; }
          void* xcb_put_image(void* c, uint8_t format, uint32_t drawable, uint32_t gc, uint16_t width, uint16_t height, int16_t dst_x, int16_t dst_y, uint8_t left_pad, uint8_t depth, uint32_t data_len, const uint8_t *data) { return NULL; }
          int xcb_flush(void* c) { return 1; }
          void* xcb_wait_for_special_event(void* c, void* se) { return NULL; }
          void* xcb_change_property(void* c, uint8_t mode, uint32_t window, uint32_t property, uint32_t type, uint8_t format, uint32_t data_len, const void* data) { return NULL; }
          EOF

          "$NDK_TOOLCHAIN_BIN/aarch64-linux-android30-clang" --sysroot="$NDK_SYSROOT" -c -Iinclude stubs_impl.c -o stubs_impl.o
          "$NDK_TOOLCHAIN_BIN/llvm-ar" rcs lib_stubs/libdrm.a stubs_impl.o
          "$NDK_TOOLCHAIN_BIN/llvm-ar" rcs lib_stubs/libexpat.a stubs_impl.o
          "$NDK_TOOLCHAIN_BIN/llvm-ar" rcs lib_stubs/libwayland-client.a stubs_impl.o
          rm -f stubs_impl.c stubs_impl.o

          cat << 'EOF' > include/sync/sync.h
          #ifndef __SYNC_SYNC_H
          #define __SYNC_SYNC_H
          #include <stdint.h>
          #include <sys/cdefs.h>
          #include <sys/ioctl.h>
          __BEGIN_DECLS
          int sync_wait(int fd, int timeout);
          int sync_merge(const char *name, int fd1, int fd2);
          __END_DECLS
          #endif
          EOF

          cat << 'EOF' > include/expat.h
          #ifndef EXPAT_H
          #define EXPAT_H
          #include <stddef.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          typedef struct xml_parser *XML_Parser;
          typedef enum {
              XML_STATUS_ERROR = 0,
              XML_STATUS_OK = 1
          } XML_Status;
          typedef void (*XML_StartElementHandler)(void *userData, const char *name, const char **atts);
          typedef void (*XML_EndElementHandler)(void *userData, const char *name);
          typedef void (*XML_CharacterDataHandler)(void *userData, const char *s, int len);
          
          XML_Parser XML_ParserCreate(const char *encoding);
          void XML_ParserFree(XML_Parser parser);
          void XML_SetUserData(XML_Parser parser, void *userData);
          void *XML_GetUserData(XML_Parser parser);
          void XML_SetElementHandler(XML_Parser parser, XML_StartElementHandler start, XML_EndElementHandler end);
          void XML_SetCharacterDataHandler(XML_Parser parser, XML_CharacterDataHandler handler);
          XML_Status XML_Parse(XML_Parser parser, const char *s, int len, int isFinal);
          void *XML_GetBuffer(XML_Parser parser, int len);
          XML_Status XML_ParseBuffer(XML_Parser parser, int len, int isFinal);
          const char *XML_ErrorString(int code);
          int XML_GetErrorCode(XML_Parser parser);
          int XML_GetCurrentLineNumber(XML_Parser parser);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF
          cp include/expat.h include/expat/expat.h

          cat << 'EOF' > include/util/shader_stats.h
          #ifndef UTIL_SHADER_STATS_H
          #define UTIL_SHADER_STATS_H
          #endif
          EOF

          echo "-> Cabeceras y stubs locales preparados con éxito."

      - name: 🛠️ 3.6. build_inside.sh conectando el Sysroot real y completo del NDK de Android
        run: |
          echo "Generando build_inside.sh..."
          
          cat << 'EOF' > build_inside.sh
          #!/bin/bash
          set -e
          
          BUILD_DIR="${1:-build}"
          
          echo "Limpiando directorios de compilación previos..."
          rm -rf "$BUILD_DIR"
          
          rm -f meson_options.txt
          
          CLANG_PATH=""
          NDK_PATH=""
          
          echo "Buscando toolchain de Android en el contenedor..."
          CLANG_PATH=$(find / -name "aarch64-linux-android*-clang" -type f 2>/dev/null | head -n 1)
          
          if [ -n "$CLANG_PATH" ]; then
              NDK_PATH=$(echo "$CLANG_PATH" | sed -E 's|/toolchains/llvm/prebuilt/.*||')
          else
              for candidate in /opt/android-ndk /usr/local/lib/android/sdk/ndk/* /root/android-sdk/ndk/* /home/runner/android/sdk/ndk/* /android/ndk/*; do
                  if [ -d "$candidate" ] && [ -f "$candidate/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" ]; then
                      NDK_PATH="$candidate"
                      CLANG_PATH="$candidate/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
                      break
                  fi
              done
          fi
          
          if [ -z "$CLANG_PATH" ] || [ ! -f "$CLANG_PATH" ]; then
              echo "❌ Error crítico: No se pudo localizar ningún compilador Clang de Android en el contenedor Docker."
              exit 1
          fi
          
          TOOLCHAIN_BIN=$(dirname "$CLANG_PATH")
          NDK_SYSROOT="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          NDK_LIB_DIR="$NDK_SYSROOT/usr/lib/aarch64-linux-android/30"
          if [ ! -d "$NDK_LIB_DIR" ]; then
              NDK_LIB_DIR="$NDK_SYSROOT/usr/lib/aarch64-linux-android"
          fi
          
          echo "-> Clang encontrado en: $CLANG_PATH"
          echo "-> NDK Sysroot real: $NDK_SYSROOT"
          echo "-> NDK Libs reales: $NDK_LIB_DIR"
          
          cat << EOT > android-aarch64.txt
          [binaries]
          c = '${TOOLCHAIN_BIN}/aarch64-linux-android30-clang'
          cpp = '${TOOLCHAIN_BIN}/aarch64-linux-android30-clang++'
          ar = '${TOOLCHAIN_BIN}/llvm-ar'
          strip = '${TOOLCHAIN_BIN}/llvm-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [built-in options]
          c_args = ['-I/workspace/include', '-I/workspace/include/expat', '-I/workspace/include/libdrm', '--sysroot=${NDK_SYSROOT}', '-D__ANDROID_API__=30']
          cpp_args = ['-I/workspace/include', '-I/workspace/include/expat', '-I/workspace/include/libdrm', '--sysroot=${NDK_SYSROOT}', '-D__ANDROID_API__=30']
          c_link_args = ['--sysroot=${NDK_SYSROOT}', '-L${NDK_LIB_DIR}', '-L/workspace/lib_stubs', '-ldrm', '-lexpat', '-lwayland-client', '-ldl', '-llog', '-landroid']
          cpp_link_args = ['--sysroot=${NDK_SYSROOT}', '-L${NDK_LIB_DIR}', '-L/workspace/lib_stubs', '-ldrm', '-lexpat', '-lwayland-client', '-ldl', '-llog', '-landroid']
          EOT
          
          echo "Configurando entorno de pkg-config con PKG_CONFIG_PATH..."
          export PKG_CONFIG_PATH="/workspace/local-pkgconfig"
          unset PKG_CONFIG_LIBDIR
          
          meson setup "$BUILD_DIR" \
              --cross-file android-aarch64.txt \
              --prefix=/usr \
              --libdir=lib \
              --buildtype=release \
              -Dplatforms=x11,wayland \
              -Degl=disabled \
              -Dllvm=disabled \
              -Dshared-llvm=disabled \
              -Dgallium-opencl=disabled \
              -Dvideo-codecs="" \
              -Dgallium-drivers="" \
              -Dvulkan-drivers=wrapper \
              -Dzstd=disabled \
              -Dzlib=disabled \
              -Dshader-cache=disabled || true

          echo "Aplicando parches preventivos para dependencias de Android opcionales..."
          python3 -c "
          import os, re
          targets = ['subprojects/libadrenotools', 'src/vulkan/wrapper']
          for target in targets:
              if os.path.exists(target):
                  for root, dirs, files in os.walk(target):
                      for file in files:
                          if file == 'meson.build':
                              path = os.path.join(root, file)
                              with open(path, 'r') as f:
                                  code = f.read()
                              
                              for lib in ['android', 'log', 'dl', 'aaudio', 'drm', 'expat', 'wayland-client']:
                                  code = re.sub(r'([a-zA-Z0-9_]+)\.find_library\s*\(\s*[\'\"]' + lib + r'[\'\"][^\)]*\)', rf\"\1.find_library('{lib}', required : false)\", code)
                              
                              with open(path, 'w') as f:
                                  f.write(code)
          print('-> Parches preventivos aplicados con éxito.')
          "

          echo "Reconfigurando y compilando con Meson..."
          export PKG_CONFIG_PATH="/workspace/local-pkgconfig"
          unset PKG_CONFIG_LIBDIR
          
          meson setup "$BUILD_DIR" \
              --cross-file android-aarch64.txt \
              --prefix=/usr \
              --libdir=lib \
              --buildtype=release \
              --reconfigure \
              -Dplatforms=x11,wayland \
              -Degl=disabled \
              -Dllvm=disabled \
              -Dshared-llvm=disabled \
              -Dgallium-opencl=disabled \
              -Dvideo-codecs="" \
              -Dgallium-drivers="" \
              -Dvulkan-drivers=wrapper \
              -Dzstd=disabled \
              -Dzlib=disabled \
              -Dshader-cache=disabled
              
          meson compile -C "$BUILD_DIR"
          EOF
          
          chmod +x build_inside.sh
          echo "-> build_inside.sh generado correctamente."

      - name: 🐳 4. Construir Contenedor Gráfico Local con Panfrost
        run: |
          docker build -f Dockerfile.build -t local-wrapper-compiler:latest .

      - name: 🛠️ 5. Ejecutar Compilador Local Unificado
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" local-wrapper-compiler:latest ${{ env.BUILD_DIR }}

      - name: 📦 6. Forjar Paquete Esencial Original de Rendimiento Máximo (Mesa 26.2 + Wrapper)
        run: |
          WRAPPER_SO="build/src/vulkan/wrapper/libvulkan_wrapper.so"
          
          if [ -f "$WRAPPER_SO" ]; then
            echo "-> [Host] ¡Éxito! Estructurando tu paquete original compatible de producción..."
            rm -rf final_pkg
            mkdir -p final_pkg/usr/lib final_pkg/usr/share/vulkan/icd.d
            
            cp -fv "$WRAPPER_SO" final_pkg/usr/lib/libvulkan_wrapper.so
            
            cp -fv ./build/subprojects/libadrenotools/*.so ./build/subprojects/libadrenotools/src/hook/*.so final_pkg/usr/lib/ 2>/dev/null || true
            chmod -R 755 final_pkg/usr/lib/
            
            patchelf --set-soname libvulkan_wrapper.so final_pkg/usr/lib/libvulkan_wrapper.so || true
            find final_pkg/usr/lib/ -name "*.so" -exec patchelf --set-rpath '$ORIGIN' {} \; 2>/dev/null || true
            
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
            echo '{"ICD": {"api_version": "1.3.289", "library_path": "libvulkan_wrapper.so"}, "file_format_version": "1.0.0"}' > final_pkg/usr/share/vulkan/icd.d/wrapper_icd.arm.json
            
            sync && sleep 3
            
            cd final_pkg && tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/ && cd ..
            echo "-> ¡Paquete Mesa 26.2 + Wrapper forjado con éxito!"
          else
            echo "-> [❌ ERROR GRAVE] El binario libvulkan_wrapper.so no se encuentra en build/."
            exit 1
          fi

      - name: 🚀 7. Subir Artefacto Completo a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mesa26-Mali-Wrapper
          path: wrapper.tzst
          retention-days: 7
