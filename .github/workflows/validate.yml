name: Validate Vulkan Shaders

on: [push, pull_request]

jobs:
  validate-shaders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vulkan SDK / Shaderc tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools

      - name: Compile GLSL to SPIR-V and Validate
        run: |
          # 1. Compila y valida el shader SDR (BCn -> ASTC)
          glslangValidator -V -S comp src/vulkan/wrapper/wrapper_bcn_transcode.comp -o wrapper_bcn_transcode.spv
          spirv-val wrapper_bcn_transcode.spv

          # 2. Compila y valida el shader HDR (BC6H -> ASTC HDR, 4x4 / 6x6 / 8x8)
          glslangValidator -V -S comp src/vulkan/wrapper/bc6h_to_astc.comp -o bc6h_to_astc.spv
          spirv-val bc6h_to_astc.spv

          echo "¡Ambos shaders son completamente válidos y compatibles con SPIR-V!"
