name: Mesa 26.2 NDK Panfrost Native Vulkan (.tzst)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILD_DIR: build

jobs:
  build-android-wrapper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [release]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Patch anon_file.c for memfd_create
        run: |
          sed -i 's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' src/util/anon_file.c

      # INYECCIÓN PURA PARA ENLAZAR EL CONSTRUCTOR AL KERNEL DE ANDROID
      - name: Surgical Silicon Modification (Vulkan Native Connection MALI)
        run: |
          echo "-> Forzando el enlace de inicializacion de Vulkan nativo con Android..."
          TARGET_FILE="src/panfrost/vulkan/panvk_device.c"
          
          if [ -f "$TARGET_FILE" ]; then
            sed -i 's/\r$//' "$TARGET_FILE"
            cat << 'EOF' > temp_patch.c
            #include <stdio.h>
            #include <stdlib.h>
            
            extern int mallopt(int param, int value);
            extern int setenv(const char *name, const char *value, int overwrite);
            
            __attribute__((constructor)) static void init_mali_t618_vulkan(void) {
                mallopt(-1002, 0);
                // Forzamos el modo Mailbox y le indicamos a Mesa que el entorno grafico es Android nativo
                setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1);
                setenv("vblank_mode", "0", 1);
                setenv("MESA_LOADER_DRIVER_OVERRIDE", "panfrost", 1);
            }
          EOF
            cat temp_patch.c "$TARGET_FILE" > temp_final.c
            mv temp_final.c "$TARGET_FILE"
            rm temp_patch.c
            echo "-> ¡Inyección de hardware Vulkan acoplada!"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              llvm-20-dev \
              libclang-20-dev \
              libclc-20-dev \
              libllvmspirvlib-20-dev \
              libelf-dev \
              spirv-tools \
              bison \
              flex \
              libdrm-dev \
              pkg-config \
              zstd
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      - name: Generate Shims
        run: |
          unzip shims.zip -d ./

      - name: Generate Host Tools
        run: |
          meson setup build-host \
              -Dplatforms=[] \
              -Dgallium-drivers=[] \
              -Dvulkan-drivers=[] \
              -Dtools=panfrost \
              -Dprecomp-compiler=enabled \
              -Dinstall-precomp-compiler=true \
              -Dllvm=enabled \
              -Dmesa-clc=enabled -Dinstall-mesa-clc=true
          ninja -C build-host src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile
          ln -sf "build-host/src/compiler/clc/mesa_clc" "build-host/src/compiler/clc/mesa-clc"
          ln -sf "build-host/src/compiler/spirv/vtn_bindgen2" "build-host/src/compiler/spirv/vtn-bindgen2"
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/clc" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/spirv" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/panfrost/clc" >> $GITHUB_PATH

      - name: Setup Meson Cross-Compilation
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/shims
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          envsubst < android.toml > android-cross.txt
          
          # PARAMETROS DE CONEXIÓN NATIVA:
          # -Dplatforms=android (Eliminamos x11 para obligar a usar SurfaceFlinger de tu móvil)
          # -Dvulkan-drivers=panfrost (Compila el driver Vulkan PanVK)
          meson setup ${{ env.BUILD_DIR }} --reconfigure \
              --cross-file android-cross.txt \
              -Dbuildtype=${{ matrix.build-type }} \
              -Dplatforms=android \
              -Dandroid-stub=true \
              -Dandroid-libbacktrace=disabled \
              -Dplatform-sdk-version=30 \
              -Dglx=disabled \
              -Dgbm=disabled \
              -Degl=disabled \
              -Dopengl=false \
              -Dgles1=disabled \
              -Dgles2=disabled \
              -Dglvnd=disabled \
              -Dvalgrind=disabled \
              -Dgallium-drivers= \
              -Dshared-glapi=disabled \
              -Dzstd=disabled \
              -Dmesa-clc=system \
              -Dprecomp-compiler=system \
              -Dvulkan-drivers=panfrost \
              -Dllvm=disabled

      - name: Compile Project
        run: |
          meson compile -C ${{ env.BUILD_DIR }}

      # EMPAQUETADO VULKAN PURO PARA PROCESADORES MALI
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Creando arbol de directorios de Linux para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Capturando el binario nativo de Vulkan Panfrost..."
          cp ${{ env.BUILD_DIR }}/src/panfrost/vulkan/libvulkan_panfrost.so pkg/usr/lib/libvulkan_wrapper.so
          
          echo "-> Inyectando manifiesto JSON ICD oficial..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          echo "-> Comprimiendo la estructura en formato atomico wrapper.tzst..."
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Vulkan-Native
          path: wrapper.tzst
          if-no-files-found: error
