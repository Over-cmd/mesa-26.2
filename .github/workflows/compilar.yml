name: Mesa 26.2 NDK Panfrost Packager (.tzst)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILD_DIR: build

jobs:
  build-android-wrapper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [release] # Usamos solo release para Bannerlator para máximo rendimiento

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Patch anon_file.c for memfd_create
        run: |
          sed -i 's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' src/util/anon_file.c

      # ¡ESTE PASO CORRIGE EL ERROR DE SINTAXIS EN CLANG!
      - name: Surgical Silicon Modification (Anti-Overflow & Smooth Videos MALI Panfrost)
        run: |
          echo "-> Rastreando la inicializacion real de Vulkan de Mesa 26.2..."
          
          # Buscamos el punto de entrada maestro del Driver ICD de Vulkan en Mesa
          VK_ENTRY_FILE="src/vulkan/runtime/vk_instance.c"
          
          if [ -f "$VK_ENTRY_FILE" ]; then
            echo "-> Aplicando inyección segura en la inicialización de la instancia: $VK_ENTRY_FILE"
            sed -i 's/\r$//' "$VK_ENTRY_FILE"
            
            # Inyectamos prototipos estándar de gestión de memoria al principio del archivo
            sed -i '1iextern int mallopt(int param, int value);' "$VK_ENTRY_FILE"
            sed -i '1iextern int setenv(const char *name, const char *value, int overwrite);' "$VK_ENTRY_FILE"
            
            # En lugar de romper punteros de función, inyectamos la purga de memoria mallopt(-1002, 0)
            # y el modo mailbox justo al arrancar la creación de la instancia de Vulkan
            sed -i '/vk_instance_init/!b;n;i\\ extern int mallopt(int p, int v);\\n extern int setenv(const char *n, const char *v, int o);\\n mallopt(-1002, 0);\\n setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1);\\n setenv("vblank_mode", "0", 1);' "$VK_ENTRY_FILE"
            echo "-> Parche inyectado de forma limpia y segura sin romper la sintaxis C."
          else
            echo "-> Fallback seguro: Aplicando inyección en el punto de entrada de Panvk..."
            PANVK_ENTRY="src/panfrost/vulkan/panvk_device.c"
            if [ -f "$PANVK_ENTRY" ]; then
              sed -i '1iextern int mallopt(int param, int value);' "$PANVK_ENTRY"
              sed -i '1iextern int setenv(const char *name, const char *value, int overwrite);' "$PANVK_ENTRY"
              sed -i '/panvk_CreateInstance/!b;n;i\\ mallopt(-1002, 0);\\n setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1);\\n setenv("vblank_mode", "0", 1);' "$PANVK_ENTRY"
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              llvm-20-dev \
              libclang-20-dev \
              libclc-20-dev \
              libllvmspirvlib-20-dev \
              libelf-dev \
              spirv-tools \
              bison \
              flex \
              libdrm-dev \
              pkg-config \
              zstd
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      - name: Generate Shims
        run: |
          unzip shims.zip -d ./

      - name: Generate Host Tools
        run: |
          meson setup build-host \
              -Dplatforms=[] \
              -Dgallium-drivers=[] \
              -Dvulkan-drivers=[] \
              -Dtools=panfrost \
              -Dprecomp-compiler=enabled \
              -Dinstall-precomp-compiler=true \
              -Dllvm=enabled \
              -Dmesa-clc=enabled -Dinstall-mesa-clc=true
          ninja -C build-host src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile
          ln -sf "build-host/src/compiler/clc/mesa_clc" "build-host/src/compiler/clc/mesa-clc"
          ln -sf "build-host/src/compiler/spirv/vtn_bindgen2" "build-host/src/compiler/spirv/vtn-bindgen2"
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/clc" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/spirv" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/build-host/src/panfrost/clc" >> $GITHUB_PATH

      - name: Setup Meson Cross-Compilation
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/shims
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          envsubst < android.toml > android-cross.txt
          meson setup ${{ env.BUILD_DIR }} --reconfigure \
              --cross-file android-cross.txt \
              -Dbuildtype=${{ matrix.build-type }} \
              -Dplatforms=android,x11 \
              -Dandroid-stub=true \
              -Dandroid-libbacktrace=disabled \
              -Dplatform-sdk-version=30 \
              -Dglx=disabled \
              -Dgbm=disabled \
              -Degl=disabled \
              -Dopengl=false \
              -Dgles1=disabled \
              -Dgles2=disabled \
              -Dglvnd=disabled \
              -Dvalgrind=disabled \
              -Dgallium-drivers= \
              -Dshared-glapi=disabled \
              -Dzstd=disabled \
              -Dmesa-clc=system \
              -Dprecomp-compiler=system \
              -Dvulkan-drivers=panfrost \
              -Dllvm=disabled

      - name: Compile Project
        run: |
          meson compile -C ${{ env.BUILD_DIR }}

      # ESTE PASO ADAPTA EL BINARIO DE PANFROST A LA ESTRUCTURA QUE BANNERLATOR LEE
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Creando arbol de directorios de Linux para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Moviendo libvulkan_panfrost.so a la ruta del driver..."
          cp ${{ env.BUILD_DIR }}/src/panfrost/vulkan/libvulkan_panfrost.so pkg/usr/lib/libvulkan_wrapper.so
          
          echo "-> Inyectando manifiesto JSON ICD oficial..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          echo "-> Comprimiendo la estructura en formato atomico wrapper.tzst..."
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Panfrost-Mesa26.2
          path: wrapper.tzst
          if-no-files-found: error
