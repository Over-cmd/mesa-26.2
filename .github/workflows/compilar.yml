name: Mesa 26.2 Leegao Vulkan Wrapper Mali (.tzst)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILD_DIR: build

jobs:
  build-android-wrapper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [release]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Patch anon_file.c for memfd_create
        run: |
          sed -i 's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' src/util/anon_file.c

      # INYECTAMOS EL BYPASS DE LEEGAO CON TU MALLOPT ESTABLE EN EL CORAZÓN DEL ENRUTADOR
      - name: Surgical Silicon Modification (Leegao Vulkan Bypass MALI)
        run: |
          echo "-> Creando el puente de inyeccion de Leegao para conectar el Vulkan de fábrica..."
          
          # Creamos la cabecera limpia con el bypass y las optimizaciones para Deadpool
          cat << 'EOF' > src/vulkan/wrapper/mali_leegao_bypass.h
          #ifndef MALI_LEEGAO_BYPASS_H
          #define MALI_LEEGAO_BYPASS_H
          
          #include <stdio.h>
          #include <stdlib.h>
          
          extern int mallopt(int param, int value);
          extern int setenv(const char *name, const char *value, int overwrite);
          
          // Este constructor fuerza al puente de Leegao a abrir el Vulkan oficial de tu Unisoc T618
          __attribute__((constructor)) static void load_leegao_mali_bypass(void) {
              mallopt(-1002, 0);
              setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1);
              setenv("vblank_mode", "0", 1);
              // Forzamos al wrapper a buscar el driver Vulkan original de Android en tu Mali-G52
              setenv("VK_ICD_FILENAMES", "/vendor/etc/vulkan/icd.d/mali.json", 1);
          }
          
          #endif
          EOF
          
          # Buscamos el archivo de entrada del wrapper de Leegao en el repositorio de Mesa
          WRAPPER_MAIN=$(find src/vulkan/wrapper/ -name "*.c" | head -n 1)
          
          if [ -n "$WRAPPER_MAIN" ] && [ -f "$WRAPPER_MAIN" ]; then
            echo "-> Soldando el bypass de Leegao directamente en: $WRAPPER_MAIN"
            sed -i 's/\r$//' "$WRAPPER_MAIN"
            sed -i '1i#include "mali_leegao_bypass.h"' "$WRAPPER_MAIN"
            echo "-> ¡Bypass de Leegao soldado correctamente!"
          else
            echo "-> Fallback: Aplicando bypass global en la carga del cargador de drivers de Mesa..."
            FALLBACK_LOADER="src/vulkan/util/vk_icd_vulkan.c"
            if [ -f "$FALLBACK_LOADER" ]; then
              sed -i '1i#include "../wrapper/mali_leegao_bypass.h"' "$FALLBACK_LOADER"
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              llvm-20-dev \
              libclang-20-dev \
              libclc-20-dev \
              libllvmspirvlib-20-dev \
              libelf-dev \
              spirv-tools \
              bison \
              flex \
              libdrm-dev \
              pkg-config \
              zstd
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      - name: Generate Shims
        run: |
          unzip shims.zip -d ./

      - name: Generate Host Tools
        run: |
          meson setup build-host \
              -Dplatforms=[] \
              -Dgallium-drivers=[] \
              -Dvulkan-drivers=[] \
              -Dtools= \
              -Dprecomp-compiler=disabled \
              -Dllvm=disabled
          mkdir -p build-host/src/compiler/clc
          touch build-host/src/compiler/clc/mesa_clc
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/clc" >> $GITHUB_PATH

      # CONFIGURAMOS MESON PARA COMPILAR ÚNICAMENTE LA VARIANTE WRAPPER DE LEEGAO
      - name: Setup Meson Cross-Compilation
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/shims
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          envsubst < android.toml > android-cross.txt
          
          # MODIFICACIÓN MAESTRA:
          # -Dvulkan-drivers=wrapper (Forzamos el componente de Leegao que conecta con tu sistema)
          # -Dgallium-drivers= (Vacio, no queremos drivers experimentales que rompan la conexion)
          meson setup ${{ env.BUILD_DIR }} --reconfigure \
              --cross-file android-cross.txt \
              -Dbuildtype=${{ matrix.build-type }} \
              -Dplatforms=android \
              -Dandroid-stub=true \
              -Dandroid-libbacktrace=disabled \
              -Dplatform-sdk-version=30 \
              -Dglx=disabled \
              -Dgbm=disabled \
              -Degl=disabled \
              -Dopengl=false \
              -Dgles1=disabled \
              -Dgles2=disabled \
              -Dglvnd=disabled \
              -Dvalgrind=disabled \
              -Dgallium-drivers= \
              -Dshared-glapi=disabled \
              -Dzstd=disabled \
              -Dmesa-clc=disabled \
              -Dprecomp-compiler=disabled \
              -Dvulkan-drivers=wrapper \
              -Dllvm=disabled

      - name: Compile Project
        run: |
          meson compile -C ${{ env.BUILD_DIR }}

      # RECOLECTAMOS EL COCHEVO DE LEEGAO EMBAJADO PARA TU BANNERLATOR
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Creando arbol de directorios de Linux para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Capturando la libreria del wrapper de Leegao recien compilada..."
          # Buscamos el archivo .so del wrapper generado en las carpetas de salida
          WRAPPER_SO=$(find ${{ env.BUILD_DIR }}/ -name "*wrapper*.so" -o -name "libvulkan_wrapper.so" | head -n 1)
          if [ -n "$WRAPPER_SO" ]; then
            cp "$WRAPPER_SO" pkg/usr/lib/libvulkan_wrapper.so
          else
            # Si Meson lo guardo con el nombre estandar de la API, lo renombramos nosotros
            cp ${{ env.BUILD_DIR }}/*/vulkan/wrapper/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so || cp $(find ${{ env.BUILD_DIR }}/ -name "*.so" | head -n 1) pkg/usr/lib/libvulkan_wrapper.so
          fi
          
          echo "-> Inyectando manifiesto JSON ICD oficial..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          echo "-> Comprimiendo la estructura en formato atomico wrapper.tzst..."
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Leegao-Bypass-Mesa26.2
          path: wrapper.tzst
          if-no-files-found: error
