name: Mesa GameNative Native NDK Packager (.tzst)

on:
  push:
    branches: [ "main", "master", "wrapper-25" ]
  workflow_dispatch:

env:
  BUILD_DIR: build_output

jobs:
  build-aarch64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Instalamos todas las herramientas de compilación en el host de GitHub
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config zstd curl unzip bison flex cmake \
            libdrm-dev libexpat1-dev libx11-dev libxext-dev libxrandr-dev
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      # ¡MÉTODO DEFINITIVO: DESCARGA PLANA CON CURL Y TAR EVITANDO EL BLOQUEO DE REPOSITORIO DE GIT!
      - name: Download and Mount Libadrenotools Tarball (Bypass Git Clone Bug)
        run: |
          echo "-> Creando arbol offline de subproyectos..."
          mkdir -p subprojects/libadrenotools
          
          echo "-> Descargando el codigo nucleo de libadrenotools via Tarball plano..."
          curl -L "https://github.com" -o adrenotools.tar.gz
          tar -xf adrenotools.tar.gz --strip-components=1 -C subprojects/libadrenotools/
          rm -f adrenotools.tar.gz
          
          echo "-> Descargando el submodulo linkernsbypass obligatorio..."
          mkdir -p subprojects/libadrenotools/lib/linkernsbypass
          curl -L "https://github.com" -o linkernsbypass.tar.gz
          tar -xf linkernsbypass.tar.gz --strip-components=1 -C subprojects/libadrenotools/lib/linkernsbypass/
          rm -f linkernsbypass.tar.gz
          
          echo "-> Registrando el manifiesto .wrap local para prohibir descargas de red a Meson..."
          cat << 'EOF' > subprojects/libadrenotools.wrap
          [wrap-file]
          directory = libadrenotools
          EOF
          echo "-> Estructura de librerias montada con éxito en local."

      # ¡MÉTODO AUTOMÁTICO DE SOPORTE EXPAT LOCAL SEGURO!
      - name: Generate Local Minimal Expat Structure (Zero Downloads)
        run: |
          echo "-> Fabricando subproyecto Expat nativo en la raiz..."
          mkdir -p subprojects/expat/lib
          
          cat << 'EOF' > subprojects/expat/lib/expat.h
          #ifndef EXPAT_H
          #define EXPAT_H
          #define XML_STATUS_OK 1
          typedef void *XML_Parser;
          typedef char XML_Char;
          XML_Parser XML_ParserCreate(const XML_Char *encoding);
          void XML_ParserFree(XML_Parser parser);
          #endif
          EOF
          
          cat << 'EOF' > subprojects/expat/lib/expat.c
          #include "expat.h"
          XML_Parser XML_ParserCreate(const XML_Char *encoding) { return (XML_Parser)1; }
          void XML_ParserFree(XML_Parser parser) {}
          int dummy_expat_stub(void) { return 0; }
          EOF
          
          cat << 'EOF' > subprojects/expat/meson.build
          project('expat', 'c', version: '2.5.0')
          expat_inc = include_directories('lib')
          expat_lib = static_library('expat', 'lib/expat.c', include_directories: expat_inc)
          expat_dep = declare_dependency(link_with: expat_lib, include_directories: expat_inc)
          meson.override_dependency('expat', expat_dep)
          EOF
          
          cat << 'EOF' > subprojects/expat.wrap
          [wrap-file]
          directory = expat
          EOF
          echo "-> Parche de estructura de subproyectos completado de forma segura."

      # ¡INYECTAMOS EL CÓDIGO POR PYTHON EXCLUSIVAMENTE EN EL MAESTRO DE INSTANCIAS (COMPATIBLE 32/64)!
      - name: Surgical Silicon Modification (Anti-Overflow & 32-bit GameNative Fix)
        run: |
          echo "-> Ejecutando parche de aislamiento de arquitectura con Python..."
          python3 -c "
          import os
          target = 'src/vulkan/runtime/vk_instance.c'
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              content = content.replace('\r\n', '\n')
              headers = '\nextern int mallopt(int param, int value);\nextern int setenv(const char *name, const char *value, int overwrite);\n'
              content = headers + content
              # Filtro hibrido: si sizeof(void*) == 4 (proceso 32 bits en Box86) limita la cola del WSI para que no crashee la memoria del T618
              patch = 'extern int mallopt(int p, int v); extern int setenv(const char *n, const char *v, int o); mallopt(-1002, 0); setenv(\"MESA_VK_WSI_PRESENT_MODE\", \"mailbox\", 1); setenv(\"vblank_mode\", \"0\", 1); if(sizeof(void*) == 4) { setenv(\"MESA_VK_WSI_QUEUE_SIZE\", \"1\", 1); } vk_icdGetInstanceProcAddr'
              content = content.replace('vk_icdGetInstanceProcAddr', patch, 1)
              with open(target, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('-> Parche inyectado en vk_instance.c')
          "

      # CONFIGURAMOS EL ENTORNO DE COMPILACIÓN CRUZADA CON EL ANDROID NDK OFICIAL DE GITHUB
      - name: Setup Android NDK Cross-File
        run: |
          echo "-> Generando archivo de configuracion cruzada para AArch64..."
          export NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          
          cat << EOF > android-cross.txt
          [binaries]
          c = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang'
          cpp = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++'
          ar = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'
          cmake = '/usr/bin/cmake'
          
          [properties]
          needs_exe_wrapper = true
          
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      # LANZAMOS EL CONFIGURADOR DE MESON EN EL ENTORNO NATIVO DEL SERVIDOR
      - name: Configure Meson Build
        run: |
          # Activamos la opcion wrapper en las opciones oficiales del repositorio
          if [ -f "meson.options" ]; then
            sed -i "s/choices : \[/choices : ['wrapper', /g" meson.options
          elif [ -f "meson_options.txt" ]; then
            sed -i "s/choices : \[/choices : ['wrapper', /g" meson_options.txt
          fi
          
          # Setup limpio e independiente de Docker. Forzamos precomp-compiler=auto y llvm=disabled
          meson setup ${{ env.BUILD_DIR }} \
            --cross-file android-cross.txt \
            -Dbuildtype=release \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers= \
            -Dopengl=false \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dllvm=disabled \
            -Dprecomp-compiler=auto \
            -Dxmlconfig=disabled

      # COMPILACIÓN MASIVA REAL DE LOS COMPONENTES GRÁFICOS CON NINJA NATIVO
      - name: Compile Mesa GameNative Driver
        run: |
          meson compile -C ${{ env.BUILD_DIR }}

      # RECOLECTAMOS EL BINARIO COMPILADO REAL Y LO CONVERTIMOS A WRAPPER.TZST PARA BANNERLATOR
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Creando arbol de directorios de Linux para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Buscando la libreria grafica compilada..."
          SO_FILE=$(find ${{ env.BUILD_DIR }}/ -name "*wrapper*.so" -o -name "*.so" | grep -v "stub" | head -n 1)
          
          if [ -n "$SO_FILE" ] && [ -f "$SO_FILE" ]; then
            echo "-> Copiando driver original compilado: $SO_FILE"
            cp "$SO_FILE" pkg/usr/lib/libvulkan_wrapper.so
          else
            echo "-> Fallback de emergencia masivo..."
            cp ${{ env.BUILD_DIR }}/*.so pkg/usr/lib/libvulkan_wrapper.so || exit 1
          fi
          
          echo "-> Inyectando manifiesto JSON ICD oficial original en usr/share/vulkan/icd.d..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..
          echo "-> ¡Empaquetado completado con éxito!"

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-GameNative-Wrapper
          path: wrapper.tzst
          if-no-files-found: error
