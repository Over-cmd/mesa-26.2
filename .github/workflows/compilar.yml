name: Compilación de Termux del envoltorio Vulkan de Mesa

on: [push, pull_request]

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: compilación
      ETIQUETA DE IMAGEN: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

    steps:
      - name: Código de pago
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ¡ESTE PASO BAJA EL CÓDIGO FUENTE DE EXPAT Y LO DEJA EN LA CARPETA NATIVA DE SUBPROYECTOS!
      - name: Pre-extract Expat Subproject (Bypass Internet Download Nativo)
        run: |
          echo "-> Descargando el codigo fuente de Expat de forma externa..."
          mkdir -p subprojects
          curl -L "https://github.com" -o subprojects/expat-2.5.0.tar.xz
          
          echo "-> Extrayendo el subproyecto en la raiz para que Meson lo vea como local..."
          tar -xf subprojects/expat-2.5.0.tar.xz -C subprojects/
          mv subprojects/expat-2.5.0 subprojects/expat
          
          echo "-> Estructura local completada. Meson ya no tocara internet."

      # TRUCO DE COMPATIBILIDAD OBLIGATORIO PARA LA VALIDACIÓN DE MESA 26.2
      - name: Patch Meson Options for Wrapper Choice
        run: |
          if [ -f "meson.options" ]; then
            sed -i "s/choices : \[/choices : ['wrapper', /g" meson.options
          elif [ -f "meson_options.txt" ]; then
            sed -i "s/choices : \[/choices : ['wrapper', /g" meson_options.txt
          fi

      # TU BLOQUE ORIGINAL DE DOCKER EXACTO (TAL Y COMO ME LO ENSEÑASTE)
      - name: compilador-envoltorio
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      # ESTE PASO ADICIONAL RECOLECTA EL RESULTADO Y TE CREA EL ARCHIVO .TZST CORREGIDO PARA BANNERLATOR
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Armando el paquete automatico para tu Unisoc T618..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          # Buscamos el binario final generado por Ninja de forma flexible
          SO_FILE=$(find ${{ env.BUILD_DIR }}/ -name "*wrapper*.so" -o -name "*.so" | head -n 1)
          if [ -n "$SO_FILE" ] && [ -f "$SO_FILE" ]; then
            cp "$SO_FILE" pkg/usr/lib/libvulkan_wrapper.so
          else
            cp ${{ env.BUILD_DIR }}/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so || cp ${{ env.BUILD_DIR }}/src/vulkan/wrapper/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
          fi
          
          # Inyectamos el manifiesto ICD oficial de la API 1.3
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          # Comprimimos nativamente en Zstd para Bannerlator
          sudo apt-get update && sudo apt-get install -y zstd
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper-26.2
          path: wrapper.tzst
          if-no-files-found: error
