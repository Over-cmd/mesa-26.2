name: Mesa 26.2 Native NDK Wrapper Packager (.tzst)

on:
  push:
    branches: [ "main", "master", "26-2", "mesa-26.2" ]
  workflow_dispatch:

env:
  BUILD_DIR: build_output

jobs:
  build-aarch64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Forzamos una version estable de Python para evitar el bug del parser

      # Instalamos absolutamente todas las herramientas de compilación cruzada en el servidor de GitHub
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config zstd curl unzip bison flex \
            libdrm-dev libexpat1-dev libx11-dev libxext-dev libxrand-dev
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      # INYECTAMOS EL BYPASS DE LEEGAO EN EL CARGADOR DE VULKAN DE MESA 26.2
      - name: Surgical Silicon Modification (Leegao Vulkan Bypass MALI)
        run: |
          echo "-> Creando el archivo de cabecera con el bypass de Leegao..."
          mkdir -p src/vulkan/wrapper
          cat << 'EOF' > src/vulkan/wrapper/mali_leegao_bypass.h
          #ifndef MALI_LEEGAO_BYPASS_H
          #define MALI_LEEGAO_BYPASS_H
          
          #include <stdio.h>
          #include <stdlib.h>
          
          extern int mallopt(int param, int value);
          extern int setenv(const char *name, const char *value, int overwrite);
          
          // Constructor automatico que conecta con el Vulkan oficial de tu Unisoc T618
          __attribute__((constructor)) static void load_leegao_mali_bypass(void) {
              mallopt(-1002, 0);
              setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1);
              setenv("vblank_mode", "0", 1);
              setenv("VK_ICD_FILENAMES", "/vendor/etc/vulkan/icd.d/mali.json", 1);
          }
          
          #endif
          EOF
          
          # Soldamos el puente directamente en la utilidad de carga de Vulkan de Mesa
          TARGET_LOADER="src/vulkan/util/vk_util.c"
          if [ -f "$TARGET_LOADER" ]; then
            echo "-> Soldando el bypass de Leegao en: $TARGET_LOADER"
            sed -i 's/\r$//' "$TARGET_LOADER"
            cat src/vulkan/wrapper/mali_leegao_bypass.h "$TARGET_LOADER" > temp_final.c
            mv temp_final.c "$TARGET_LOADER"
          else
            RUNTIME_FILE=$(find src/vulkan/ -name "*.c" | head -n 1)
            if [ -n "$RUNTIME_FILE" ]; then
              cat src/vulkan/wrapper/mali_leegao_bypass.h "$RUNTIME_FILE" > temp_final.c
              mv temp_final.c "$RUNTIME_FILE"
            fi
          fi

      # CONFIGURAMOS EL ARCHIVO DE COMPILACIÓN CRUZADA PARA EL ANDROID NDK OFICIAL
      - name: Setup Android NDK Cross-File
        run: |
          echo "-> Generando archivo de configuracion cruzada para AArch64..."
          # Usamos el Android NDK preinstalado de fabrica en las maquinas virtuales de GitHub
          export NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          
          cat << EOF > android-cross.txt
          [binaries]
          c = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang'
          cpp = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++'
          ar = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'
          
          [properties]
          needs_exe_wrapper = true
          
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      # LANZAMOS EL CONFIGURADOR DE MESON SOBRE EL PROPIO SERVIDOR DE GITHUB
      - name: Configure Meson Build
        run: |
          # Desbloqueamos la opcion 'wrapper' en caso de que lo requiera tu meson.options
          if [ -f "meson.options" ]; then
            sed -i "s/choices : \[/choices : ['wrapper', /g" meson.options
          elif [ -f "meson_options.txt" ]; then
            sed -i "s/choices : \[/choices : ['wrapper', /g" meson_options.txt
          fi
          
          # Setup limpio e independiente de Docker, compilando unicamente el componente wrapper
          meson setup ${{ env.BUILD_DIR }} \
            --cross-file android-cross.txt \
            -Dbuildtype=release \
            -Dplatforms=android \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers= \
            -Dopengl=false \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dllvm=disabled \
            -Dxmlconfig=disabled

      # COMPILACIÓN AUTOMÁTICA ULTRA-RÁPIDA CON NINJA NATIVO
      - name: Compile Mesa 26.2 Wrapper
        run: |
          meson compile -C ${{ env.BUILD_DIR }}

      # CONVERSIÓN COMPRIMIDA AUTOMÁTICA A WRAPPER.TZST PARA BANNERLATOR
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Creando arbol de directorios de Linux para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Buscando el binario generado..."
          SO_FILE=$(find ${{ env.BUILD_DIR }}/ -name "*wrapper*.so" -o -name "*.so" | head -n 1)
          if [ -n "$SO_FILE" ] && [ -f "$SO_FILE" ]; then
            cp "$SO_FILE" pkg/usr/lib/libvulkan_wrapper.so
          else
            exit 1
          fi
          
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper-26.2-Nativo
          path: wrapper.tzst
          if-no-files-found: error
