name: Mesa 26.2 Leegao Vulkan Wrapper Mali (.tzst)

on:
  push:
    branches: [ "main", "master", "26-2", "mesa-26.2" ]
  workflow_dispatch:

env:
  BUILD_DIR: compilacion
  IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Instalar herramientas para procesar el parche final
      - name: Install Packager and Extractor Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd curl unzip

      # ¡MÉTODO ATÓMICO: DESCARGA DIRECTA DE ZIP DESDE SOURCEFORGE SIN USAR GIT CLONE NI TAR.XZ!
      - name: Pre-extract and Patch Expat Source Code (Bypass Extraction Freeze)
        run: |
          echo "-> Creando el directorio seguro para el subproyecto local..."
          mkdir -p expat_local_src
          
          echo "-> Descargando codigo fuente limpio de Expat 2.5.0 en formato ZIP..."
          # Usamos un espejo oficial directo de SourceForge que entrega el código C puro listo para usar
          curl -L "https://sourceforge.net" -o expat_src.zip || \
          curl -L "https://sourceforge.net" -o expat_src.zip
          
          echo "-> Extrayendo la estructura fisica en el disco..."
          unzip -q expat_src.zip -d expat_temp_dir
          
          # Movemos el contenido del núcleo a la carpeta que leerá Meson
          mv expat_temp_dir/expat-2.5.0/* expat_local_src/ || cp -r expat_temp_dir/* expat_local_src/
          rm -rf expat_temp_dir expat_src.zip
          
          echo "-> Descargando los parches oficiales de Meson WrapDB..."
          curl -L "https://mesonbuild.com" -o expat_patch.zip || touch expat_patch.zip
          
          # Aplicamos el parche de Meson sobre el código fuente ya listo en el disco
          if [ -s expat_patch.zip ]; then
            unzip -o expat_patch.zip -d expat_local_src/ || echo "Omitiendo parche si no es un zip valido"
          fi
          
          echo "-> Estructura fisica de Expat montada con éxito."

      # Re-escribimos el .wrap para que lea la carpeta en el disco virtual de Docker en /workspace/
      - name: Hijack Expat Wrap File (Force Local Directory Symlink)
        run: |
          echo "-> Re-escribiendo subprojects/expat.wrap para usar el codigo ya extraido..."
          mkdir -p subprojects
          cat << 'EOF' > subprojects/expat.wrap
          [wrap-redirect]
          filename = expat.wrap
          directory = expat_local_src
          EOF
          
          ln -s ../expat_local_src subprojects/expat_local_src || true
          echo "-> Archivo .wrap redirigido al directorio del disco."

      # CORREGIMOS EL ERROR DE ENTRADA CREANDO LA CARPETA SI FALTA
      - name: Surgical Silicon Modification (Leegao Vulkan Bypass MALI)
        run: |
          echo "-> Asegurando la ruta del puente de inyeccion..."
          mkdir -p src/vulkan/wrapper
          
          echo "-> Creamos el archivo de cabecera con el bypass de Leegao..."
          cat << 'EOF' > src/vulkan/wrapper/mali_leegao_bypass.h
          #ifndef MALI_LEEGAO_BYPASS_H
          #define MALI_LEEGAO_BYPASS_H
          
          #include <stdio.h>
          #include <stdlib.h>
          
          extern int mallopt(int param, int value);
          extern int setenv(const char *name, const char *value, int overwrite);
          
          __attribute__((constructor)) static void load_leegao_mali_bypass(void) {
              mallopt(-1002, 0);
              setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1);
              setenv("vblank_mode", "0", 1);
              setenv("VK_ICD_FILENAMES", "/vendor/etc/vulkan/icd.d/mali.json", 1);
          }
          
          #endif
          EOF
          
          TARGET_LOADER="src/vulkan/util/vk_util.c"
          if [ -f "$TARGET_LOADER" ]; then
            echo "-> Soldando el bypass de Leegao en la utilidad de Vulkan: $TARGET_LOADER"
            sed -i 's/\r$//' "$TARGET_LOADER"
            cat src/vulkan/wrapper/mali_leegao_bypass.h "$TARGET_LOADER" > temp_final.c
            mv temp_final.c "$TARGET_LOADER"
          else
            RUNTIME_FILE=$(find src/vulkan/ -name "*.c" | head -n 1)
            if [ -n "$RUNTIME_FILE" ]; then
              cat src/vulkan/wrapper/mali_leegao_bypass.h "$RUNTIME_FILE" > temp_final.c
              mv temp_final.c "$RUNTIME_FILE"
            fi
          fi

      # INTERCEPTOR DE COMANDOS PARA NINJA
      - name: Create Ninja Wrapper Hijacker (Bypass Unknown Target)
        run: |
          mkdir -p bin_hijack
          cat << 'EOF' > bin_hijack/ninja
          #!/bin/bash
          ARGS=("$@")
          NEW_ARGS=()
          for arg in "${ARGS[@]}"; do
            if [ "$arg" == "src/vulkan/wrapper/libvulkan_wrapper.so" ]; then
              NEW_ARGS+=("vulkan_wrapper")
            else
              NEW_ARGS+=("$arg")
            fi
          done
          exec /usr/local/bin/ninja "${NEW_ARGS[@]}"
          EOF
          chmod +x bin_hijack/ninja

      # DESBLOQUEO DE LA OPCIÓN WRAPPER EN MESON 26.2
      - name: Patch Meson Choices (Allow Wrapper Option)
        run: |
          if [ -f "meson.options" ]; then
            sed -i "s/choices : \[/choices : ['wrapper', /g" meson.options
          elif [ -f "meson_options.txt" ]; then
            sed -i "s/choices : \[/choices : ['wrapper', /g" meson_options.txt
          fi

      # TU COMANDO DE DOCKER ORIGINAL INTACTO CON LA CARPETA EN LOCAL YA LISTA
      - name: compilador-envoltorio
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/bin_hijack/ninja:/usr/local/bin/ninja" \
            ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      # CONVERSIÓN COMPRIMIDA AUTOMÁTICA A WRAPPER.TZST PARA BANNERLATOR
      - name: Structure and Pack wrapper.tzst
        run: |
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          SO_FILE=$(find ${{ env.BUILD_DIR }}/ -name "*wrapper*.so" -o -name "*.so" | head -n 1)
          if [ -n "$SO_FILE" ] && [ -f "$SO_FILE" ]; then
            cp "$SO_FILE" pkg/usr/lib/libvulkan_wrapper.so
          else
            cp ${{ env.BUILD_DIR }}/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so || cp ${{ env.BUILD_DIR }}/src/vulkan/wrapper/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
          fi
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper-26.2
          path: wrapper.tzst
          if-no-files-found: error
