name: Mesa 26.2 Native NDK Wrapper Packager (.tzst)

on:
  push:
    branches: [ "main", "master", "26-2", "mesa-26.2" ]
  workflow_dispatch:

env:
  BUILD_DIR: build_output

jobs:
  build-aarch64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Instalamos las herramientas nativas de compilación en el servidor host
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config zstd curl unzip bison flex cmake \
            libdrm-dev libexpat1-dev libx11-dev libxext-dev libxrandr-dev
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging

      # INYECTAMOS EL BYPASS DE LEEGAO CON TU MALLOPT(-1002,0) EN EL MOTOR MAESTRO DE VULKAN
      - name: Surgical Silicon Modification (Leegao Vulkan Bypass MALI)
        run: |
          echo "-> Creando el archivo de cabecera con el bypass de Leegao..."
          mkdir -p src/vulkan/wrapper
          cat << 'EOF' > src/vulkan/wrapper/mali_leegao_bypass.h
          #ifndef MALI_LEEGAO_BYPASS_H
          #define MALI_LEEGAO_BYPASS_H
          
          #include <stdio.h>
          #include <stdlib.h>
          
          extern int mallopt(int param, int value);
          extern int setenv(const char *name, const char *value, int overwrite);
          
          // El constructor atómico que redirige DXVK hacia el driver oficial de tu Mali-G52
          __attribute__((constructor)) static void load_leegao_mali_bypass(void) {
              mallopt(-1002, 0);
              setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1);
              setenv("vblank_mode", "0", 1);
              setenv("VK_ICD_FILENAMES", "/vendor/etc/vulkan/icd.d/mali.json", 1);
          }
          
          #endif
          EOF
          
          # Soldamos la inyección en el cargador maestro vk_util.c para que se active al arrancar Vulkan
          TARGET_LOADER="src/vulkan/util/vk_util.c"
          if [ -f "$TARGET_LOADER" ]; then
            echo "-> Soldando el bypass de Leegao en: $TARGET_LOADER"
            sed -i 's/\r$//' "$TARGET_LOADER"
            cat src/vulkan/wrapper/mali_leegao_bypass.h "$TARGET_LOADER" > temp_final.c
            mv temp_final.c "$TARGET_LOADER"
          else
            RUNTIME_FILE=$(find src/vulkan/ -name "*.c" | head -n 1)
            if [ -n "$RUNTIME_FILE" ]; then
              cat src/vulkan/wrapper/mali_leegao_bypass.h "$RUNTIME_FILE" > temp_final.c
              mv temp_final.c "$RUNTIME_FILE"
            fi
          fi

      # CONFIGURAMOS EL ENTORNO DE COMPILACIÓN CRUZADA CON EL NDK
      - name: Setup Android NDK Cross-File
        run: |
          echo "-> Generando archivo de configuracion cruzada para AArch64..."
          export NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          
          cat << EOF > android-cross.txt
          [binaries]
          c = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang'
          cpp = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++'
          ar = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'
          cmake = '/usr/bin/cmake'
          
          [properties]
          needs_exe_wrapper = true
          
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      # GENERAMOS LAS HERRAMIENTAS LOCALES DEL HOST PARA ASISTIR A PANFROST SIN REQUERIR LLVM EXTERNO
      - name: Generate Host Tools
        run: |
          meson setup build-host \
              -Dplatforms=[] \
              -Dgallium-drivers=[] \
              -Dvulkan-drivers=[] \
              -Dllvm=disabled \
              -Dprecomp-compiler=disabled \
              -Dmesa-clc=disabled
          mkdir -p build-host/src/compiler/clc
          touch build-host/src/compiler/clc/mesa_clc
          echo "$GITHUB_WORKSPACE/build-host/src/compiler/clc" >> $GITHUB_PATH

      # ¡CONFIGURACIÓN DE DRIVER REAL COMPILANDO EL NÚCLEO PANFROST DE VULKAN DIRECTO!
      - name: Configure Meson Build
        run: |
          # Cambiamos vulkan-drivers=panfrost y desactivamos OpenCL (mesa-clc=disabled) junto a LLVM
          # Esto obliga a Meson a compilar la biblioteca de Vulkan física real inyectando tu bypass de Leegao
          meson setup ${{ env.BUILD_DIR }} \
            --cross-file android-cross.txt \
            -Dbuildtype=release \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers= \
            -Dopengl=false \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dllvm=disabled \
            -Dmesa-clc=disabled \
            -Dprecomp-compiler=disabled \
            -Dxmlconfig=disabled

      # COMPILACIÓN AUTOMÁTICA REAL DE LOS ELEMENTOS GRÁFICOS
      - name: Compile Mesa 26.2 Driver
        run: |
          meson compile -C ${{ env.BUILD_DIR }}

      # PASO DE CAPTURA DEL BINARIO AUTÉNTICO .SO DE VULKAN PARA TU MALÍ
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Creando arbol de directorios de Linux para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Buscando el archivo .so real generado por Ninja..."
          # Localizamos de forma flexible la biblioteca compartida de Vulkan compilada para Android
          SO_FILE=$(find ${{ env.BUILD_DIR }}/ -name "*panfrost*.so" -o -name "*vulkan*.so" | grep -v "stub" | head -n 1)
          
          if [ -n "$SO_FILE" ] && [ -f "$SO_FILE" ]; then
            echo "-> Copiando driver original compilado: $SO_FILE"
            cp "$SO_FILE" pkg/usr/lib/libvulkan_wrapper.so
          else
            echo "-> Busqueda secundaria de archivos compilados..."
            cp $(find ${{ env.BUILD_DIR }}/ -name "*.so" | grep -v "stub" | head -n 1) pkg/usr/lib/libvulkan_wrapper.so || exit 1
          fi
          
          echo "-> Inyectando manifiesto JSON ICD oficial en usr/share/vulkan/icd.d..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..
          echo "-> ¡Empaquetado completado con éxito!"

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Mali-Wrapper-26.2-Vulkan-Puro
          path: wrapper.tzst
          if-no-files-found: error
